        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
            --accent-color: #0071e3;
            --border-color: #e5e5e7;
            --secondary-text: #86868b;
        }
        @media (prefers-color-scheme: dark) {

                --border-color: #222b35;
                --secondary-text: #86868b;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin: 20px 0;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-color);
        }
        h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-top: 30px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }
        h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 20px;
        }
        p, li {
            font-size: 1rem;
            color: var(--text-color);
            opacity: 0.9;
        }
        .meta-info {
            color: var(--secondary-text);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .section-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 40px 0;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
        }
