<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Health — Destek / Support</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F7F5F0; /* Canva'da seçtiğimiz premium krem tonu */
            color: #333333;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #4E6542; /* Tasarımlarımızdaki matcha yeşili tonu */
            font-size: 24px;
            margin-bottom: 24px;
            font-weight: 700;
        }
        .section {
            margin-bottom: 20px;
            padding: 10px 0;
        }
        .text-tr {
            font-size: 16px;
            font-weight: 500;
            color: #444;
            margin-bottom: 4px;
        }
        .text-en {
            font-size: 15px;
            color: #777;
            font-style: italic;
            margin-bottom: 12px;
        }
        .email-box {
            background-color: #F0F4EE;
            padding: 14px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #E2EBE0;
        }
        .email-link {
            color: #4E6542;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
        }
        .email-link:hover {
            text-decoration: underline;
        }
        .footer-tr {
            font-size: 14px;
            color: #666;
            margin-top: 24px;
        }
        .footer-en {
            font-size: 13px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Omni Health</h1>
    
    <div class="section">
        <div class="text-tr">Soru, öneri ve sorun bildirimleri için:</div>
        <div class="text-en">For questions, feedback and issue reports:</div>
    </div>

    <div class="email-box">
        📧 <a href="mailto:support.omniapp@gmail.com" class="email-link">support.omniapp@gmail.com</a>
    </div>

    <div class="section">
        <div class="footer-tr">Yanıt süresi genellikle 24-48 saattir.</div>
        <div class="footer-en">We usually respond within 24-48 hours.</div>
    </div>
</div>

</body>
</html>
